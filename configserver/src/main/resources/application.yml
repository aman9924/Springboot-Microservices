spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    stream:
      bindings:
        springCloudBusInput:
          group: configserver
    config:
      server:
        git:
          uri: "https://github.com/aman9924/Microservices.git"
        #        native:
#          search-locations: "file:///D://config"

          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true

management:
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include: "*"

encrypt:

  key: "ABC123"
server:
  port: 8071


